[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maths-cleaned"
version = "0.1.0"
description = "A clean, Decimal-based math module implemented without Python's math library."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Dhruvaditya Yellapu" }
]
requires-python = ">=3.9"
keywords = [
    "math",
    "decimal",
    "education",
    "math-from-scratch",
    "clean-code"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/yourusername/maths--cleaned-python-module"
Repository = "https://github.com/yourusername/maths--cleaned-python-module"
Issues = “https://github.com/dhhlk/better-math-for-python/issues”

[tool.setuptools]
packages = ["maths_cleaned"]

